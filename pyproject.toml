[project]
name = "fastApi-demo"
version = "0.1.0"
description = "High-performance FastAPI service with clean architecture and authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.1.0",
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pwdlib[argon2]>=0.2.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff specific rules
]
ignore = ["B008"]  # Allow Depends() in parameter defaults (FastAPI standard)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
